name: Build Release DMG

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle

      - name: Build DMG
        run: cargo bundle --release

      - name: Verify DMG exists
        run: |
          echo "=== Checking build output ==="
          ls -lah target/release/bundle/dmg/
          file target/release/bundle/dmg/Ticker.dmg

      - name: Check DMG integrity
        run: |
          echo "=== DMG integrity check ==="
          hdiutil verify target/release/bundle/dmg/Ticker.dmg || echo "⚠️ DMG warning (but continuing)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/dmg/Ticker.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: success()
        run: echo "✅ Release created successfully!"
